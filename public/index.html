<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Say vs. Do</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <h1 class="wordmark">Say <span class="vs">vs.</span> Do</h1>
          <p class="tagline">Verificador de afirmaciones en directo</p>
        </div>
        <div class="top-actions">
          <span id="mockBadge" class="pill pill-mock" hidden>MOCK</span>
          <div class="segmented" role="group" aria-label="Modo">
            <button type="button" class="seg-btn toggle-btn" data-mode="news" aria-pressed="true">Noticias</button>
            <button type="button" class="seg-btn toggle-btn" data-mode="corporate" aria-pressed="false">Empresas</button>
          </div>
          <button id="themeBtn" type="button" class="icon-btn" aria-label="Cambiar tema claro/oscuro" title="Tema claro/oscuro">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="score" aria-label="Marcador Dice vs. Hace">
          <div class="score-head">
            <h2 class="score-title">Dice <span class="vs">vs.</span> Hace</h2>
            <span id="scoreTotal" class="muted small tabular">0 afirmaciones en esta sesión</span>
          </div>
          <div class="score-grid">
            <div class="tile v-supported"><span class="tile-num tabular" data-score="SUPPORTED">0</span><span class="tile-label">Respaldadas</span></div>
            <div class="tile v-misleading"><span class="tile-num tabular" data-score="MISLEADING">0</span><span class="tile-label">Engañosas</span></div>
            <div class="tile v-false"><span class="tile-num tabular" data-score="FALSE">0</span><span class="tile-label">Falsas</span></div>
            <div class="tile v-unverifiable"><span class="tile-num tabular" data-score="UNVERIFIABLE">0</span><span class="tile-label">No verificables</span></div>
          </div>
          <div class="score-bar" aria-hidden="true">
            <span class="seg v-supported" data-bar="SUPPORTED"></span>
            <span class="seg v-misleading" data-bar="MISLEADING"></span>
            <span class="seg v-false" data-bar="FALSE"></span>
            <span class="seg v-unverifiable" data-bar="UNVERIFIABLE"></span>
          </div>
          <p id="scoreDemo" class="muted small" hidden></p>
        </section>

        <section class="composer" aria-label="Entrada">
          <label for="transcript" class="sr-only">Pegar transcripción</label>
          <textarea id="transcript" rows="5" maxlength="5000"
            placeholder="Pega lo que se dijo, el enlace de una noticia, o pulsa el micrófono. Ej.: «Alemania generó en 2025 el 60 % de su electricidad con renovables.»"></textarea>
          <p id="interim" class="interim" aria-live="polite"></p>
          <div class="composer-bar">
            <div class="live-controls">
              <button id="liveBtn" type="button" class="mic-btn" aria-pressed="false" aria-label="Micrófono en directo">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
                <span class="mic-label">En directo</span>
              </button>
              <select id="langSelect" class="select" aria-label="Idioma del micrófono">
                <option value="de-DE">DE</option>
                <option value="en-US">EN</option>
                <option value="es-ES" selected>ES</option>
              </select>
              <span id="liveState" class="muted small">Micrófono apagado</span>
            </div>
            <div class="submit">
              <span id="charCount" class="muted small tabular">0 / 5000</span>
              <button id="checkBtn" type="button" class="btn-primary">Comprobar</button>
            </div>
          </div>
        </section>

        <p id="status" class="status" role="status"></p>

        <section id="results" class="results" aria-live="polite"></section>
      </main>

      <footer class="foot">
        <span id="cost" class="tabular"></span>
        <span>Resultados orientativos: revisa siempre la fuente.</span>
      </footer>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
